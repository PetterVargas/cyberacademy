<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-3owl" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080" style="
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div data-hf-id="hf-skp3" id="kicker" class="clip" data-start="0" data-duration="10" data-track-index="0" style="
          position: absolute;
          top: 380px;
          width: 100%;
          text-align: center;
          font-size: 32px;
          letter-spacing: 8px;
          color: #818cf8;
          text-transform: uppercase;
        ">
        CyberAcademy
      </div>

      <div data-hf-id="hf-nkep" id="title" class="clip" data-start="0.3" data-duration="9.7" data-track-index="1" style="
          position: absolute;
          top: 460px;
          width: 100%;
          text-align: center;
          font-size: 96px;
          font-weight: 700;
          color: #fff;
        ">
        HyperFrames — Ejemplo Intro
      </div>

      <div data-hf-id="hf-wtsi" id="subtitle" class="clip" data-start="0.8" data-duration="9.2" data-track-index="2" style="
          position: absolute;
          top: 620px;
          width: 100%;
          text-align: center;
          font-size: 36px;
          color: #c7d2fe;
        ">
        Videos cortos explicativos, renderizados desde HTML
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#kicker", { opacity: 0, y: 20, duration: 0.6 }, 0);
      tl.from("#title", { opacity: 0, y: 40, duration: 0.8 }, 0.3);
      tl.from("#subtitle", { opacity: 0, y: 20, duration: 0.6 }, 0.8);
      tl.to(
        ["#kicker", "#title", "#subtitle"],
        { opacity: 0, y: -20, duration: 0.6 },
        9.0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
