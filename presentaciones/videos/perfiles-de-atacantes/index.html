    <style>
      * {

        padding: 0;
        box-sizing: border-box;
      }
      html,

        height: 1080px;
        overflow: hidden;
        background: #07080a;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }

      #bg-gradient {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 28% 22%, rgba(77, 174, 132, 0.07), transparent 60%),
          radial-gradient(ellipse 55% 45% at 78% 82%, rgba(57, 178, 152, 0.06), transparent 60%),
          #07080a;
      }

      #brand-logo {
        position: absolute;
        left: 1490px;
        top: 460px;
        width: 788px;
        height: auto;
        opacity: 0;
        pointer-events: none;
      }

      #network-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }

      #watermark {
        position: absolute;
        right: 48px;
        bottom: 40px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgb(132, 135, 135);
        opacity: 0;
      }

      /* Diagram nodes + edges */
      .node {
        position: absolute;
        width: 256px;
        height: 160px;
        opacity: 0;
      }

      .node-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 18px;
        background: rgba(20, 27, 25, 0.6);
        border: 1.5px solid rgba(77, 174, 132, 0.45);
        border-radius: 14px;
        box-shadow:
          0 0 0 1px rgba(77, 174, 132, 0.08),
          0 18px 40px rgba(0, 0, 0, 0.35),
          0 0 32px rgba(77, 174, 132, 0.08);
      }

      .node-inner::before {
        content: "";
        position: absolute;
        left: 20px;
        top: 16px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgb(120, 214, 172);
        box-shadow: 0 0 10px 2px rgba(120, 214, 172, 0.55);
      }

      .node-inner::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 3px;
        border-radius: 14px 14px 0 0;
        background: rgba(77, 174, 132, 0.85);
      }

      .node-label {
        color: #eef2f0;
        font-size: 25px;
        font-weight: 600;
        line-height: 1.25;
        text-align: center;
        letter-spacing: 0.005em;
      }

      .edge {
        position: absolute;
        overflow: visible;
      }

      .node-label.small {
        font-size: 21px;
      }

      /* Scene wrapper: exists purely so a whole diagram (nodes + edges) can
         exit as one rigid group — GSAP animates the wrapper instead of every
         child individually, so the group slides/fades as a single unit. */
      .scene-group {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        var DUR = 21.0;
        var W = 1920;
        var H = 1080;
        var PRIMARY = "77, 174, 132";

        var LINK_DISTANCE = 210;
        var PARTICLE_COUNT = 140;
        var PULSE_DURATION = 1.0;
        var PULSE_INTERVAL = 1.1;
        var PULSE_MAX_RADIUS = 46;

        // Deterministic hash, pure function of n — no Math.random, no Date.now.
        // Same shape as the sin-based hash used across the HyperFrames catalog
        // (e.g. cosmic-orb's h1), so every render and every seek reproduces
        // identical particle placement, velocity, and phase.
        function hash(n) {
          var s = Math.sin(n * 127.1) * 43758.5453;
          return s - Math.floor(s);
        }

        var particles = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) {
          var base = i * 9.1701;
          var angle = hash(base + 1.1) * Math.PI * 2;
          var speed = 10 + hash(base + 2.3) * 22; // px/s — brisker drift than a static field
          particles.push({
            x0: hash(base + 0.7) * W,
            y0: hash(base + 3.9) * H,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: 1 + hash(base + 5.3) * 2,
            twinkleSpeed: 0.6 + hash(base + 6.7) * 1.5, // rad/s
            twinklePhase: hash(base + 8.1) * Math.PI * 2,
          });
        }

        function posAt(p, t) {
          var x = ((p.x0 + p.vx * t) % W + W) % W;
          var y = ((p.y0 + p.vy * t) % H + H) % H;
          return { x: x, y: y };
        }

        var pulseCount = Math.ceil(DUR / PULSE_INTERVAL);
        var pulses = [];
        for (var pIdx = 0; pIdx < pulseCount; pIdx++) {
          var start = 0.4 + pIdx * PULSE_INTERVAL;
          if (start >= DUR) continue;
          var targetIndex = Math.floor(hash(pIdx * 97.7 + 4.2) * PARTICLE_COUNT) % PARTICLE_COUNT;
          var target = particles[targetIndex];
          var origin = posAt(target, start);
          pulses.push({ x: origin.x, y: origin.y, start: start });
        }

        var canvas = document.getElementById("network-canvas");
        var ctx = canvas.getContext("2d");

        function draw(t) {
          ctx.clearRect(0, 0, W, H);

          var positions = particles.map(function (p) {
            return posAt(p, t);
          });

          for (var a = 0; a < particles.length; a++) {
            for (var b = a + 1; b < particles.length; b++) {
              var dx = positions[a].x - positions[b].x;
              var dy = positions[a].y - positions[b].y;
              var dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < LINK_DISTANCE) {
                var alpha = (1 - dist / LINK_DISTANCE) * 0.32;
                ctx.strokeStyle = "rgba(" + PRIMARY + ", " + alpha + ")";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(positions[a].x, positions[a].y);
                ctx.lineTo(positions[b].x, positions[b].y);
                ctx.stroke();
              }
            }
          }

          for (var i2 = 0; i2 < particles.length; i2++) {
            var p2 = particles[i2];
            var pos = positions[i2];
            var twinkle = 0.6 + Math.sin(t * p2.twinkleSpeed + p2.twinklePhase) * 0.35;
            ctx.fillStyle = "rgba(" + PRIMARY + ", " + Math.max(0.3, twinkle) + ")";
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, p2.r, 0, Math.PI * 2);
            ctx.fill();
          }

          for (var pu = 0; pu < pulses.length; pu++) {
            var pulse = pulses[pu];
            var elapsed = t - pulse.start;
            if (elapsed < 0 || elapsed > PULSE_DURATION) continue;
            var progress = elapsed / PULSE_DURATION;
            var radius = progress * PULSE_MAX_RADIUS;
            var pAlpha = (1 - progress) * 0.35;
            ctx.strokeStyle = "rgba(" + PRIMARY + ", " + pAlpha + ")";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(pulse.x, pulse.y, radius, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // The canvas repaints from a property SETTER, not onUpdate: gsap's
        // seek() suppresses events by default, so onUpdate silently never
        // fires on a scrub and the canvas would freeze on frame 0. Tweened
        // values are always written during render, suppressed or not.
        var driver = { _t: 0 };
        Object.defineProperty(driver, "t", {
          get: function () {
            return this._t;
          },
          set: function (v) {
            this._t = v;
            draw(v);
          },
        });
        tl.to(driver, { t: DUR, duration: DUR, ease: "none" }, 0);

        // Brand mark: large but tenue — off-center to the right, tilted
        // diagonally (asymmetric on both axes), behind whatever explainer
        // text/code block sits on top of this base. xPercent/yPercent anchor
        // the rotation pivot at the mark's own center; x/y then carry the
        // drift on top of that anchor without fighting it.
        gsap.set("#brand-logo", { xPercent: -50, yPercent: -50, rotation: 12 });
        tl.to("#brand-logo", { opacity: 0.0225, duration: 1.0, ease: "power1.out" }, 0);
        tl.to(
          "#brand-logo",
          { x: "+=22", y: "-=18", rotation: "+=5", duration: 4.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
          0,
        );

        // Watermark: a quiet fade-in so the frame isn't fully static from t=0,
        // then it holds — a signature, not a callout.
        tl.to("#watermark", { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.2);

        // Diagram reveal: each node pops in, then the edge leading to it
        // draws in (stroke-dashoffset -> 0), so the arrowhead only appears
        // once the line has fully reached the box. Branches 2-4 (and 6-8)
        // all originate at their motivation node's edge (a one-to-many
        // fan-out) and reveal one at a time in sequence. Scene 2 reuses the
        // exact same relative choreography as scene 1, just shifted to
        // start once scene 1 has exited.
        var nodes = [
          "#node-1", "#node-2", "#node-3", "#node-4", "#node-5",
          "#node-6", "#node-7", "#node-8", "#node-9", "#node-10",
          "#node-11", "#node-12", "#node-13", "#node-14", "#node-15", "#node-16",
        ];
        var nodeStarts = [
          0.4, 1.4, 2.4, 3.4, 4.4,
          6.5, 7.5, 8.5, 9.5, 10.5,
          12.7, 13.7, 14.7, 15.7, 16.7, 17.7,
        ];
        var edges = [
          "#edge-1", "#edge-2", "#edge-3", "#edge-4",
          "#edge-5", "#edge-6", "#edge-7", "#edge-8",
          "#edge-9", "#edge-10", "#edge-11", "#edge-12", "#edge-13",
        ];
        var edgeStarts = [1.0, 2.0, 3.0, 4.0, 7.1, 8.1, 9.1, 10.1, 13.3, 14.3, 15.3, 16.3, 17.3];

        nodes.forEach(function (sel, idx) {
          gsap.set(sel, { transformOrigin: "50% 50%" });
          tl.fromTo(
            sel,
            { opacity: 0, scale: 0.86, y: 14 },
            { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" },
            nodeStarts[idx],
          );
        });

        edges.forEach(function (sel, idx) {
          var drawStart = edgeStarts[idx];
          tl.to(sel + " line", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, drawStart);
          // Markers ignore stroke-dasharray/dashoffset entirely, so the
          // arrowhead is faded in separately, timed to land exactly as the
          // dash animation finishes drawing the line beneath it.
          tl.to("#arrowhead-" + (idx + 1) + "-tip", { opacity: 1, duration: 0.16, ease: "power1.in" }, drawStart + 0.34);
        });

        // Scene transitions: each scene finishes revealing, holds for a
        // beat, then exits as one rigid group (wrapper slides up past the
        // top edge + fades out) before the next scene reveals into the same
        // now-empty screen space. 1100px comfortably clears the lowest
        // element in either exiting scene well before each tween ends.
        tl.to("#scene-1", { y: -1100, opacity: 0, duration: 0.7, ease: "power2.in" }, 5.5);
        tl.to("#scene-2", { y: -1100, opacity: 0, duration: 0.7, ease: "power2.in" }, 11.6);

        tl.seek(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
